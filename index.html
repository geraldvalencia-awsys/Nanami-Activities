<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 4 Mathematics — for Nanami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --c-bg:#FFFFFF;
  --c-surface:#F4F7FB;
  --c-surface-2:#ECF1F8;
  --c-border:#DEE5EF;
  --c-ink:#20293A;
  --c-ink-soft:#5B6779;
  --c-blue:#2D5DA1;
  --c-blue-soft:#E7EEF9;
  --c-coral:#D8503F;
  --c-coral-soft:#FBEAE7;
  --c-teal:#128077;
  --c-teal-soft:#E4F3F1;
  --c-purple:#7A54C4;
  --c-purple-soft:#EFE9FA;
  --c-amber:#C97F19;
  --c-amber-soft:#FBF0DF;
  --c-green:#3B8B45;
  --c-green-soft:#E9F4EA;
  --shadow:0 1px 2px rgba(32,41,58,.06), 0 8px 24px rgba(32,41,58,.06);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark){
    --c-bg:#161A22;
    --c-surface:#1D2330;
    --c-surface-2:#242B3A;
    --c-border:#333D50;
    --c-ink:#EDF1F8;
    --c-ink-soft:#A6B0C3;
    --c-blue-soft:#20304C;
    --c-coral-soft:#3A2620;
    --c-teal-soft:#183430;
    --c-purple-soft:#2A2340;
    --c-amber-soft:#3A2E17;
    --c-green-soft:#1E3320;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --c-bg:#161A22;
  --c-surface:#1D2330;
  --c-surface-2:#242B3A;
  --c-border:#333D50;
  --c-ink:#EDF1F8;
  --c-ink-soft:#A6B0C3;
  --c-blue-soft:#20304C;
  --c-coral-soft:#3A2620;
  --c-teal-soft:#183430;
  --c-purple-soft:#2A2340;
  --c-amber-soft:#3A2E17;
  --c-green-soft:#1E3320;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--c-bg);
  color:var(--c-ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fredoka',system-ui,sans-serif; font-weight:600; letter-spacing:.2px;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;}

/* ---------- Header / Nav ---------- */
header{
  position:sticky; top:0; z-index:40;
  top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb, var(--c-bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--c-border);
}
.header-inner{
  max-width:1120px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:18px;
}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0; cursor:pointer; background:none; border:none; padding:0;}
.brand-badge{
  width:34px; height:34px; border-radius:10px;
  background:var(--c-blue); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fredoka'; font-weight:700; font-size:16px;
}
.brand-text{display:flex; flex-direction:column; line-height:1.15; text-align:left;}
.brand-text b{font-family:'Fredoka'; font-size:15px; color:var(--c-ink);}
.brand-text span{font-size:11.5px; color:var(--c-ink-soft);}

nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:1;}
nav::-webkit-scrollbar{display:none;}
.nav-btn{
  white-space:nowrap; padding:8px 13px; border-radius:8px; border:none;
  background:transparent; color:var(--c-ink-soft); font-size:13.5px; font-weight:600;
  cursor:pointer; transition:background .15s, color .15s;
}
.nav-btn:hover:not(.locked){background:var(--c-surface); color:var(--c-ink);}
.nav-btn.active{background:var(--c-blue-soft); color:var(--c-blue);}
:root[data-theme="dark"] .nav-btn.active, :root:not([data-theme="light"]) .nav-btn.active{color:#8FB4E8;}
@media (prefers-color-scheme: dark){ .nav-btn.active{color:#8FB4E8;} }

/* ---------- Lock Styles ---------- */
.locked { opacity:0.55; cursor:not-allowed !important; filter:grayscale(1); }
.nav-btn.locked { pointer-events:none; }
.unit-card.locked { pointer-events:none; }
.btn.locked { pointer-events:none; background:var(--c-ink-soft); }

/* ---------- Layout helpers ---------- */
main{max-width:1120px; margin:0 auto; padding:36px 20px 90px;}
.page{display:none;}
.page.active{display:block; animation:fade .35s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{color:var(--c-ink-soft); font-size:14.5px; margin:0 0 6px;}
.section-title{font-size:clamp(28px,4vw,38px); margin:0 0 4px;}
.section-sub{color:var(--c-ink-soft); font-size:16px; margin:0 0 32px;}
.card{
  background:var(--c-surface); border:1px solid var(--c-border); border-radius:16px;
  padding:24px;
}
.grid-2{display:grid; grid-template-columns:1.1fr .9fr; gap:20px;}
@media (max-width:760px){.grid-2{grid-template-columns:1fr;}}

/* ---------- Home ---------- */
.hero{
  position:relative; padding:56px 28px 48px; border-radius:22px;
  background:var(--c-blue-soft); overflow:hidden; margin-bottom:46px;
}
.hero-symbol{
  position:absolute; font-family:'Fredoka'; font-weight:600; color:var(--c-blue);
  opacity:.16; user-select:none; pointer-events:none;
}
.hero-content{position:relative; max-width:640px;}
.hero-content h1{font-size:clamp(34px,6vw,54px); margin:0 0 10px; color:var(--c-ink);}
.hero-content p{font-size:17px; color:var(--c-ink-soft); margin:0 0 26px; max-width:480px;}
.hero-tags{display:flex; gap:10px; flex-wrap:wrap;}
.tag{
  background:var(--c-bg); border:1px solid var(--c-border); border-radius:999px;
  padding:6px 14px; font-size:13px; font-weight:600; color:var(--c-ink-soft);
}
.unit-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:860px){.unit-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.unit-grid{grid-template-columns:1fr;}}
.unit-card{
  text-align:left; cursor:pointer; border:1px solid var(--c-border); border-radius:16px;
  padding:20px; background:var(--c-bg); transition:transform .15s, box-shadow .15s, border-color .15s;
  display:flex; flex-direction:column; gap:10px;
}
.unit-card:hover:not(.locked){transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--u-color);}
.unit-num{
  width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-family:'Fredoka'; font-weight:600; font-size:14px; background:var(--u-soft); color:var(--u-color);
}
.unit-card h3{font-size:17px; margin:0; color:var(--c-ink);}
.unit-card p{font-size:13.5px; color:var(--c-ink-soft); margin:0;}
.unit-card .goto{font-size:13px; font-weight:600; color:var(--u-color); margin-top:auto;}

.mission-cta{
  margin-top:40px; border-radius:16px; padding:22px 24px; background:var(--c-purple-soft);
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  border:1px solid var(--c-border);
}
.mission-cta h3{margin:0 0 4px; font-size:18px;}
.mission-cta p{margin:0; color:var(--c-ink-soft); font-size:14px;}
.btn{
  border:none; border-radius:10px; padding:11px 18px; font-weight:600; font-size:14px;
  cursor:pointer; background:var(--c-purple); color:#fff; flex-shrink:0;
}
.btn:hover:not(.locked){filter:brightness(1.06);}

/* ---------- Unit page ---------- */
.unit-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:30px; flex-wrap:wrap;}
.back-link{
  display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
  color:var(--c-ink-soft); font-size:13.5px; font-weight:600; padding:0; margin-bottom:14px;
}
.back-link:hover{color:var(--c-ink);}
.pill{
  display:inline-block; background:var(--u-soft); color:var(--u-color); font-weight:700; font-size:12.5px;
  padding:5px 12px; border-radius:999px; margin-bottom:10px;
}
.big-idea-card{background:var(--u-soft); border:1px solid var(--c-border); border-radius:18px; padding:26px;}
.big-idea-card h3{margin:0 0 10px; font-size:20px; color:var(--u-color);}
.big-idea-card p{margin:0; font-size:15.5px; color:var(--c-ink);}
.visual-wrap{
  background:var(--c-bg); border:1px solid var(--c-border); border-radius:14px; padding:16px;
  display:flex; align-items:center; justify-content:center; min-height:180px; margin-top:18px;
}
.prompt-card{margin-top:16px; background:var(--c-bg); border:1px dashed var(--c-border); border-radius:14px; padding:16px 18px;}
.prompt-card b{color:var(--u-color); font-size:13px; text-transform:none;}
.prompt-card p{margin:6px 0 0; font-size:14px; color:var(--c-ink-soft);}

.subhead{font-size:21px; margin:44px 0 4px;}
.subhead-sub{color:var(--c-ink-soft); font-size:14.5px; margin:0 0 20px;}

.example-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
@media (max-width:760px){.example-row{grid-template-columns:1fr;}}
.example-card{border:1px solid var(--c-border); border-radius:14px; padding:16px 18px; background:var(--c-bg);}
.example-card .ex-label{font-size:12px; font-weight:700; color:var(--u-color); margin-bottom:8px;}
.example-card .ex-body{font-size:16px; font-family:'JetBrains Mono',monospace; color:var(--c-ink);}

.try-card{border:1px solid var(--c-border); border-radius:14px; padding:18px 20px; background:var(--c-surface);}
.try-card h4{margin:0 0 12px; font-size:15px;}
.try-item{display:flex; align-items:flex-start; gap:10px; padding:7px 0; font-size:14.5px; cursor:pointer;}
.try-check{
  width:19px; height:19px; border-radius:6px; border:2px solid var(--c-border); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s;
}
.try-item.done .try-check{background:var(--u-color); border-color:var(--u-color);}
.try-item.done span{color:var(--c-ink-soft); text-decoration:line-through;}
.try-check svg{opacity:0; width:12px; height:12px;}
.try-item.done .try-check svg{opacity:1;}
.challenge-line{margin-top:14px; padding-top:14px; border-top:1px solid var(--c-border); font-size:14px; color:var(--c-ink-soft);}
.challenge-line b{color:var(--c-ink);}

.activity-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
@media (max-width:900px){.activity-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:560px){.activity-grid{grid-template-columns:repeat(2,1fr);}}
.activity-card{
  border:1px solid var(--c-border); border-radius:12px; padding:13px 12px; background:var(--c-bg);
  font-size:13px; cursor:pointer; transition:border-color .15s, background .15s;
}
.activity-card:hover{border-color:var(--u-color); background:var(--u-soft);}
.activity-num{font-size:11px; font-weight:700; color:var(--u-color); margin-bottom:5px;}
.activity-name{font-weight:600; color:var(--c-ink); margin-bottom:3px;}
.activity-frame{font-size:11px; color:var(--c-ink-soft);}
.activity-hint{font-size:13px; color:var(--c-ink-soft); margin:12px 0 16px;}

.practice-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:760px){.practice-grid{grid-template-columns:1fr;}}
.pq{border:1px solid var(--c-border); border-radius:14px; padding:16px 18px; background:var(--c-bg); transition:border-color .2s, background .2s;}
.pq.correct{border-color:var(--u-color); background:var(--u-soft);}
.pq p.q{font-size:14.5px; margin:0 0 10px; color:var(--c-ink);}
.pq-row{display:flex; gap:8px;}
.pq-row input{
  flex:1; min-width:0; border:1px solid var(--c-border); border-radius:9px; padding:8px 10px;
  font-size:13.5px; font-family:'JetBrains Mono',monospace; background:var(--c-surface); color:var(--c-ink);
}
.pq-row input:focus{outline:2px solid var(--u-color); outline-offset:1px;}
.pq-check{
  border:none; border-radius:9px; background:var(--u-color); color:#fff; padding:0 13px; font-weight:600;
  font-size:12.5px; cursor:pointer; flex-shrink:0;
}
.pq-fb{font-size:12.5px; margin-top:7px; min-height:15px; font-weight:600;}
.pq-fb.ok{color:var(--c-green);}
.pq-fb.bad{color:var(--c-coral);}
.practice-score{font-size:13.5px; color:var(--c-ink-soft); margin:0 0 16px;}

.unit-footer-nav{display:flex; justify-content:space-between; margin-top:46px; border-top:1px solid var(--c-border); padding-top:20px;}
.footer-nav-btn{
  display:flex; flex-direction:column; gap:2px; background:none; border:none; cursor:pointer; color:var(--c-ink);
  padding:6px; max-width:45%;
}
.footer-nav-btn small{color:var(--c-ink-soft); font-size:12px; font-weight:600;}
.footer-nav-btn span{font-size:15px; font-weight:600;}
.footer-nav-btn.next{text-align:right; align-items:flex-end; margin-left:auto;}

/* ---------- Mission page ---------- */
.mission-hero{text-align:center; padding:18px 0 8px;}
.mission-hero h1{font-size:clamp(30px,5vw,42px); margin:0 0 8px;}
.mission-hero p{color:var(--c-ink-soft); font-size:15.5px; margin:0 auto 8px; max-width:460px;}
.mission-progress{
  max-width:360px; margin:22px auto 40px; height:8px; border-radius:99px; background:var(--c-surface-2); overflow:hidden;
}
.mission-progress-fill{height:100%; width:0%; background:var(--c-purple); transition:width .3s ease; border-radius:99px;}
.mission-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:700px){.mission-grid{grid-template-columns:1fr;}}
.mq{border:1px solid var(--c-border); border-radius:16px; padding:20px; background:var(--c-surface); transition:border-color .2s, background .2s;}
.mq.correct{border-color:var(--c-green); background:var(--c-green-soft);}
.mq-num{
  width:26px; height:26px; border-radius:8px; background:var(--c-purple-soft); color:var(--c-purple);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; margin-bottom:10px;
}
.mq.correct .mq-num{background:var(--c-green); color:#fff;}
.mq p.q{font-size:15px; margin:0 0 12px; color:var(--c-ink);}
.mq-input-row{display:flex; gap:8px;}
.mq-input-row input{
  flex:1; min-width:0; border:1px solid var(--c-border); border-radius:9px; padding:9px 11px;
  font-size:14px; font-family:'JetBrains Mono',monospace; background:var(--c-bg); color:var(--c-ink);
}
.mq-input-row input:focus{outline:2px solid var(--c-purple); outline-offset:1px;}
.mq-check{
  border:none; border-radius:9px; background:var(--c-purple); color:#fff; padding:0 14px; font-weight:600;
  font-size:13px; cursor:pointer; flex-shrink:0;
}
.mq-feedback{font-size:13px; margin-top:8px; min-height:16px; font-weight:600;}
.mq-feedback.ok{color:var(--c-green);}
.mq-feedback.bad{color:var(--c-coral);}
.mission-done{
  text-align:center; margin-top:40px; padding:28px; border-radius:16px; background:var(--c-green-soft);
  border:1px solid var(--c-border); display:none;
}
.mission-done.show{display:block; animation:fade .4s ease;}
.mission-done h3{margin:0 0 6px; color:var(--c-green); font-size:20px;}
.mission-done p{margin:0; color:var(--c-ink-soft); font-size:14px;}
.mission-quote{text-align:center; margin-top:36px; font-size:15px; color:var(--c-ink-soft); font-style:italic;}

footer{max-width:1120px; margin:0 auto; padding:0 20px 40px; color:var(--c-ink-soft); font-size:12.5px; text-align:center;}

:focus-visible{outline:2px solid var(--c-blue); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }

/* ---------- Modal Styles ---------- */
.modal-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; z-index:100;
}
.modal-overlay.active { display:flex; }
.modal-content {
  background:var(--c-bg); border-radius:16px; padding:24px; max-width:400px; width:90%;
  box-shadow:var(--shadow); position:relative;
}
.modal-close {
  position:absolute; top:12px; right:12px; background:none; border:none;
  font-size:20px; cursor:pointer; color:var(--c-ink-soft);
}
.activity-task-btn {
  margin-top:16px; width:100%; padding:10px; background:var(--u-color, var(--c-blue)); color:#fff;
  border:none; border-radius:8px; font-weight:600; cursor:pointer;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <button class="brand" onclick="showPage('home')" aria-label="Go home">
      <div class="brand-badge">4</div>
      <div class="brand-text"><b>Grade 4 Mathematics</b><span>for Nanami</span></div>
    </button>
    <nav id="mainNav"></nav>
  </div>
</header>

<main id="main"></main>

<footer>Grade 4 Mathematics — Concepts, Examples &amp; Activities</footer>

<!-- Activity Modal -->
<div class="modal-overlay" id="activityModal" onclick="if(event.target===this) closeModal()">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3 id="modalTitle" style="margin-top:0; font-family:'Fredoka',sans-serif;">Activity</h3>
    <p id="modalDesc" style="color:var(--c-ink-soft); font-size:15px; margin-top:8px;"></p>
    <div style="background:var(--c-surface); padding:16px; border-radius:8px; border:1px solid var(--c-border); margin:16px 0;">
       <label style="display:block; font-size:13px; font-weight:600; margin-bottom:8px;">Your Output / Notes:</label>
       <textarea style="width:100%; height:80px; border-radius:6px; border:1px solid var(--c-border); padding:8px; font-family:inherit; resize:none;" placeholder="Type your notes, equations, or ideas here..."></textarea>
    </div>
    <button class="activity-task-btn" id="modalBtn">Mark as Complete</button>
  </div>
</div>

<script>
/* ================= DATA ================= */
function norm(s){ return String(s).toLowerCase().replace(/\s+/g,''); }

const UNITS = [
  {
    id:'place-value', num:1, color:'--c-blue', soft:'--c-blue-soft',
    title:'Place Value', teaser:'A digit\u2019s value depends on where it sits.',
    bigIdea:'A digit\u2019s value depends on its position. Each place is 10 times the value of the place to its right.',
    examples:['4,582 = 4,000 + 500 + 80 + 2','The 7 in 2,731 means 700','7,451 \u2248 7,500 (nearest hundred)'],
    activities:['Build the greatest/smallest number','Place Value Detective','Expanded Form Match','Number Line Order','Rounding Relay','Mystery Number','Compare It (<, >, =)','Number of the Day','Make a number from clues','Digit-card challenge'],
    visual:'placeValue',
    practice:[
      {q:'Write 3,916 in expanded form.', hint:'e.g. 3,000 + 900...', check:a=>{a=norm(a); return a==='3000+900+10+6';}},
      {q:'What does the 6 mean in 6,204?', hint:'a number', check:a=>norm(a)==='6000'},
      {q:'Round 8,347 to the nearest hundred.', hint:'a number', check:a=>norm(a)==='8300'},
      {q:'Which is greater: 5,462 or 5,426?', hint:'type the number', check:a=>norm(a)==='5462'},
      {q:'What is the value of the 5 in 1,529?', hint:'a number', check:a=>norm(a)==='500'},
      {q:'Write 7,000 + 400 + 8 in standard form.', hint:'a number', check:a=>norm(a)==='7408'},
      {q:'Round 4,812 to the nearest thousand.', hint:'a number', check:a=>norm(a)==='5000'},
      {q:'Which is smaller: 9,012 or 9,102?', hint:'type the number', check:a=>norm(a)==='9012'}
    ]
  },
  {
    id:'multiplication', num:2, color:'--c-coral', soft:'--c-coral-soft',
    title:'Multiplication', teaser:'Finding totals in equal groups.',
    bigIdea:'Multiplication finds totals in equal groups. Use arrays, place value, partial products, and the standard algorithm.',
    examples:['236 \u00d7 4 = 944','42 \u00d7 13 = 420 + 126 = 546','34 \u00d7 26 = 680 + 204 = 884'],
    activities:['Array Art','Shopping Challenge','Partial Products Puzzle','Multiplication War','Estimate First','Error Detective','Area Builder','Create a Word Problem','Dice Multiplication','Real-Life Planner'],
    visual:'multiplication',
    practice:[
      {q:'Solve 312 \u00d7 3.', hint:'a number', check:a=>norm(a)==='936'},
      {q:'Solve 27 \u00d7 12.', hint:'a number', check:a=>norm(a)==='324'},
      {q:'Solve 18 \u00d7 6.', hint:'a number', check:a=>norm(a)==='108'},
      {q:'Estimate 48 \u00d7 21 by rounding first.', hint:'a number', check:a=>norm(a)==='1000'},

function renderNav() {
  const nav = document.getElementById('mainNav');
  nav.innerHTML = '';
  const navItems = [{id:'home', label:'Home'}].concat(UNITS.map(u=>({id:u.id, label:u.title}))).concat([{id:'mission', label:'Math Mission'}]);
  
  navItems.forEach(item => {
    const b = document.createElement('button');
    b.className = 'nav-btn';
    b.dataset.target = item.id;
    const isLocked = item.id !== 'home' && !unlockedUnitIds.includes(item.id);
    
    if (isLocked) {
      b.textContent = '\ud83d\udd12 ' + item.label;
      b.classList.add('locked');
    } else {
      b.textContent = item.label;
      b.onclick = () => showPage(item.id);
    }
    nav.appendChild(b);
  });
  
  const activeId = location.hash.replace('#','') || 'home';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.target===activeId));
}

function visualSVG(kind, color){
  const c = `var(${color})`;
  if(kind==='placeValue'){
    const cols = [['Th','4','4,000'],['H','5','500'],['T','8','80'],['O','2','2']];
    const cells = cols.map((c2,i)=>`
      <g transform="translate(${i*88},0)">
        <rect x="0" y="0" width="72" height="72" rx="12" fill="${i===cols.length-1?c:'var(--c-surface-2)'}" fill-opacity="${i===cols.length-1?'1':'1'}"/>
        <text x="36" y="30" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="12" fill="${i===cols.length-1?'#fff':'var(--c-ink-soft)'}">${c2[0]}</text>
        <text x="36" y="56" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="${i===cols.length-1?'#fff':'var(--c-ink)'}">${c2[1]}</text>
      </g>`).join('');
    return `<svg viewBox="0 0 340 130" width="100%" style="max-width:360px" xmlns="http://www.w3.org/2000/svg">
      ${cells}
      <text x="0" y="110" font-family="JetBrains Mono" font-size="15" fill="var(--c-ink-soft)">4,582 = 4,000 + 500 + 80 + 2</text>
    </svg>`;
  }
  if(kind==='multiplication'){
    let dots='';
    for(let r=0;r<4;r++){for(let col=0;col<6;col++){
      dots+=`<circle cx="${20+col*30}" cy="${20+r*30}" r="9" fill="${c}"/>`;
    }}
    return `<svg viewBox="0 0 210 140" width="100%" style="max-width:260px" xmlns="http://www.w3.org/2000/svg">
      ${dots}
      <text x="0" y="132" font-family="JetBrains Mono" font-size="15" fill="var(--c-ink-soft)">4 rows \u00d7 6 = 24</text>
    </svg>`;
  }
  if(kind==='division'){
    let groups='';
    for(let g=0; g<4; g++){
      let dots='';
      for(let i=0;i<6;i++){
        const gx = 26 + (i%3)*22, gy = 18 + Math.floor(i/3)*22;
        dots += `<circle cx="${gx}" cy="${gy}" r="7" fill="${c}"/>`;
      }
      groups += `<g transform="translate(${g*72},0)">
        <rect x="2" y="2" width="68" height="66" rx="14" fill="none" stroke="var(--c-border)" stroke-width="2"/>
        ${dots}
      </g>`;
    }
    return `<svg viewBox="0 0 288 100" width="100%" style="max-width:320px" xmlns="http://www.w3.org/2000/svg">
      ${groups}
      <text x="0" y="96" font-family="JetBrains Mono" font-size="14" fill="var(--c-ink-soft)">24 \u00f7 4 = 6 in each group</text>
    </svg>`;
  }
  if(kind==='factors'){
    const pairs = [['1','24'],['2','12'],['3','8'],['4','6']];
    const rows = pairs.map((p,i)=>`
      <g transform="translate(0,${i*34})">
        <rect x="0" y="0" width="52" height="26" rx="7" fill="${c}" fill-opacity=".15"/>
        <text x="26" y="18" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="13" fill="${c}">${p[0]}</text>
        <text x="66" y="18" font-family="Fredoka" font-size="14" fill="var(--c-ink-soft)">×</text>
        <rect x="80" y="0" width="52" height="26" rx="7" fill="${c}" fill-opacity=".15"/>
        <text x="106" y="18" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="13" fill="${c}">${p[1]}</text>
        <text x="146" y="18" font-family="JetBrains Mono" font-size="14" fill="var(--c-ink-soft)">= 24</text>
      </g>`).join('');
    return `<svg viewBox="0 0 200 130" width="100%" style="max-width:240px" xmlns="http://www.w3.org/2000/svg">
      ${rows}
    </svg>`;
  }
  if(kind==='fractions'){
    return `<svg viewBox="0 0 240 80" width="100%" style="max-width:300px" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="10" width="200" height="40" rx="8" fill="var(--c-surface-2)"/>
      <rect x="0" y="10" width="150" height="40" rx="8" fill="${c}"/>
      <line x1="50" y1="10" x2="50" y2="50" stroke="#fff" stroke-width="2"/>
      <line x1="100" y1="10" x2="100" y2="50" stroke="#fff" stroke-width="2"/>
      <line x1="150" y1="10" x2="150" y2="50" stroke="#fff" stroke-width="2"/>
      <text x="0" y="70" font-family="JetBrains Mono" font-size="14" fill="var(--c-ink-soft)">3/4 (three fourths)</text>
    </svg>`;
  }
  if(kind==='geometry'){
    return `<svg viewBox="0 0 200 120" width="100%" style="max-width:260px" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="20" width="120" height="70" fill="${c}" fill-opacity=".15" stroke="${c}" stroke-width="3"/>
      <text x="80" y="60" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="14" fill="${c}">Area</text>
      <text x="80" y="14" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="var(--c-ink-soft)">8 cm</text>
      <text x="6" y="60" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="var(--c-ink-soft)" transform="rotate(-90 6,60)">5 cm</text>
    </svg>`;
  }
  return '';
}

function openActivity(unitId, actName) {
  const unit = UNITS.find(u => u.id === unitId);
  const modal = document.getElementById('activityModal');
  document.getElementById('modalTitle').textContent = actName;
  document.getElementById('modalTitle').style.color = `var(${unit.color})`;
  
  const prompts = [
    "Grab some paper and draw this out! How would you model it?",
    "Explain your strategy out loud as if you were teaching a partner.",
    "Use objects around the room to model this concept physically.",
    "Write down three examples that fit this activity and solve them.",
    "Create a short, fun word problem based on this activity."
  ];
  const randomPrompt = prompts[Math.floor(Math.random() * prompts.length)];
  document.getElementById('modalDesc').textContent = randomPrompt;
  
  const btn = document.getElementById('modalBtn');
  btn.style.backgroundColor = `var(${unit.color})`;
  btn.onclick = () => {
     closeModal();
     // Find the activity card visually to provide feedback
     document.querySelectorAll('.activity-card').forEach(card => {
       if(card.textContent.includes(actName)){
         card.style.background = `var(${unit.soft})`;
         card.style.borderColor = `var(${unit.color})`;
         const hint = card.querySelector('.activity-frame');
         if(hint) hint.textContent = "\u2713 Completed";
       }
     });
  };
  
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('activityModal').classList.remove('active');
}

  const allDone = missionSolved.length === MISSION.length;

  return `
    <button class="back-link" onclick="showPage('home')">\u2190 Back to Home</button>
    <div class="mission-hero">
      <h1>Math Mission</h1>
      <p>Put everything you've learned together. Solve these 6 challenges to complete Grade 4 Math!</p>
      <div class="mission-progress">
        <div class="mission-progress-fill" style="width:${(missionSolved.length/MISSION.length)*100}%"></div>
      </div>
    </div>
    <div class="mission-grid">
      ${qs}
    </div>
    <div class="mission-done ${allDone ? 'show' : ''}">
      <h3>\ud83c\udf89 Mission Accomplished!</h3>
      <p>Nanami, you are a Grade 4 Math Superstar!</p>
      <div class="mission-quote">"Mathematics is not about numbers, equations, computations, or algorithms: it is about understanding." \u2014 William Paul Thurston</div>
    </div>
  `;
}

function checkPractice(uId, i) {
  const u = UNITS.find(x=>x.id===uId);
  const input = document.getElementById(`pi-${uId}-${i}`);
  const fb = document.getElementById(`pfb-${uId}-${i}`);
  const val = input.value;
  if (!val) return;
  if (u.practice[i].check(val)) {
    fb.textContent = 'Correct!';
    fb.className = 'pq-fb ok';
    document.getElementById(`pq-${uId}-${i}`).classList.add('correct');
    input.disabled = true;
    document.getElementById(`pq-${uId}-${i}`).querySelector('button').disabled = true;
    document.getElementById(`pq-${uId}-${i}`).querySelector('button').textContent = '\u2713';
    u.practice[i].answer = val;
    
    if (!practiceSolved[uId].includes(i)) {
      practiceSolved[uId].push(i);
      localStorage.setItem('nanamiPractice', JSON.stringify(practiceSolved));
    }
    
    document.getElementById(`score-${uId}`).textContent = `Solved: ${practiceSolved[uId].length} / ${u.practice.length}`;
    
    // Unlock next
    if (practiceSolved[uId].length === u.practice.length) {
      const uIndex = UNITS.findIndex(x=>x.id===uId);
      if (uIndex < UNITS.length - 1) {
        const nextId = UNITS[uIndex+1].id;
        if (!unlockedUnitIds.includes(nextId)) {
          unlockedUnitIds.push(nextId);
          localStorage.setItem('nanamiUnlocked', JSON.stringify(unlockedUnitIds));
          renderNav();
        }
      } else {
        if (!unlockedUnitIds.includes('mission')) {
          unlockedUnitIds.push('mission');
          localStorage.setItem('nanamiUnlocked', JSON.stringify(unlockedUnitIds));
          renderNav();
        }
      }
      showPage(uId); // Re-render to update footer button
    }
  } else {
    fb.textContent = 'Try again!';
    fb.className = 'pq-fb bad';
  }
}

function checkMission(i) {
  const input = document.getElementById(`mi-${i}`);
  const fb = document.getElementById(`mfb-${i}`);
  const val = input.value;
  if (!val) return;
  if (MISSION[i].check(val)) {
    fb.textContent = 'Correct!';
    fb.className = 'mq-feedback ok';
    document.getElementById(`mq-${i}`).classList.add('correct');
    input.disabled = true;
    document.getElementById(`mq-${i}`).querySelector('button').disabled = true;
    document.getElementById(`mq-${i}`).querySelector('button').textContent = '\u2713';
    MISSION[i].answer = val;
    
    if (!missionSolved.includes(i)) {
      missionSolved.push(i);
      localStorage.setItem('nanamiMission', JSON.stringify(missionSolved));
    }
    showPage('mission'); 
  } else {
    fb.textContent = 'Try again!';
    fb.className = 'mq-feedback bad';
  }
}

function showPage(id) {
  const main = document.getElementById('main');
  if (id === 'home') {
    main.innerHTML = renderHome();
  } else if (id === 'mission') {
    main.innerHTML = renderMission();
  } else {
    const unit = UNITS.find(u => u.id === id);
    if (unit) main.innerHTML = renderUnit(unit);
  }
  renderNav();
  location.hash = id;
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', () => {
  const id = location.hash.replace('#','') || 'home';
  showPage(id);
});

// Initialize app
const initialId = location.hash.replace('#','') || 'home';
showPage(initialId);

</script>
